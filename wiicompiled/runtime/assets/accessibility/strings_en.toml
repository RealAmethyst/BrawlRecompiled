# The acting player while two or more humans share the screen, as the cards label them (MenSelchrCard.1-4).
player = "P{number}"
# Another player's card, by its place from the left (no caption on screen).
card = "Card {number}"
# A player's token (the coin, MenSelchrCoin; its label is the player's).
token = "Token"
# A card's costume: costumes have pictures only, so their place in the fighter's list.
