    "Allow adequate room around you during game play.",
    "When using a controller connected to the Wii Remote, put the wrist strap through the connector hook.",
    "Put on and tighten the wrist strap. Hold the Wii Remote securely and do not let go of it. Use the Wii Remote Jacket.",
]
