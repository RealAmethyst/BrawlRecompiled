# Screen-reader wording owned by the accessibility layer (src/accessibility). Text the game has in its own message
# files is read from the game and never repeated here; this file holds only what the game draws as art (titles and
# button labels baked into textures) and the layer's own phrases. Arrays follow the game's cursor order.

# A menu item's place in its list: {index} is 1-based, {total} the number of items the player can reach.
position = "{index} of {total}"
# A slider's position, 0 to 100 (the game draws sliders without numbers).
percent = "{value} percent"
on = "On"
off = "Off"

[main_menu.titles]
# MenMainTitle_TopN frames: 1-6, 7, 8, 11, 20-25, 27 and 16 (texture MenMainTtlJ).
select_mode = "Select Mode"
group = "Group"
solo = "Solo"
options = "Options"
screen = "Screen"
deflicker = "Deflicker"
rumble = "Rumble"
controls = "Controls"
sound = "Sound"
my_music = "My Music"
erase_data = "Erase Data"
names = "Names"

# MenMainTitle_TopN lambert35 frames 10, 19, 12, 28, 30 (MenMainTtlJ.04, .13, .06, .21, .23).
vault = "Vault"
trophies_stickers = "Trophies & Stickers"
data = "Data"
records = "Records"
movies = "Movies"

[main_menu.items]
# MenMainFrTop10, 11, 15, 12, 13, 14.
top = ["Group", "Solo", "Nintendo Wi-Fi Connection", "Vault", "Options", "Data"]
# MenMainFrMul01, 02, 05, 04, 03, 06.
group = ["Brawl", "Special Brawl", "Tourney", "Rotation", "Rules", "Names"]
# MenMainSg00, 10, 02, 04, 05, 06.
solo = ["Classic", "Adventure Mode", "All-Star", "Events", "Stadium", "Training"]
# MenMainOp00, 01, 02, 03, 04, 05, 07.
options = ["Screen", "Deflicker", "Rumble", "Controls", "Sound", "My Music", "Erase Data"]
# The Screen setting's choices, in value order: MenMainOption03Font1, Font2.
screen = ["4:3 Standard", "16:9 Widescreen"]
# The Deflicker setting's value, Off then On: MenMainWave05.0, .1.
deflicker = ["Off", "On"]
# The Sound screen's rows: the balance slider, named by its end labels as they read left to right
# (MenMainSound04SoundJ, MenMainSound05MusicJ), and MenMainSound08ST.
sound = ["Sound Effects, Music", "Sound Test"]
# Rumble's tabs: MenMainWave00font01, font02.
rumble_tabs = ["Controller", "Names"]
# MenMainDelete03Font01 to Font05.
erase_data = ["P1 High Score", "Brawl Records", "Adventure", "Vault Data", "Erase All"]

# Vault buttons by cursor (models 22-28 = archive models MenMainIcon0401, 0406, 0404, 0402, 0405, 0408, 0403):
# MenMainColl01_1 to 01_7 ("MASTER-PIECES" is broken over two lines).
vault = ["Trophies & Stickers", "Stage Builder", "Album", "Challenges", "Replays", "Masterpieces", "Chronicle"]
# Models 175-179 (MenMainIcon0411, 0414, 0412, 0415, 0413): MenMainColl02_6, 02_7, 02_9, 02_10, 02_8.
trophies_stickers = ["Trophy Gallery", "Trophy Hoard", "Coin Launcher", "Sticker Center", "Sticker Album"]
# Models 36-38 (MenMainIcon0601-0603): MenMainData06, 08, 07.
data = ["Movies", "Sound Test", "Records"]
# Models 108-110 (MenMainIcon0621-0623): MenMainData15, 16, 17.
records = ["Group Records", "Brawl Records", "Notices"]

[boot]
